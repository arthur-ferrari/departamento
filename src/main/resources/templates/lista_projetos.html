<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Projetos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Projetos</h1>
    <a href="/projetos/novo">Novo Projeto</a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Data de Início</th>
                <th>Departamento</th>
                <th>Funcionário</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="projeto : ${projetos}">
                <td th:text="${projeto.id}"></td>
                <td th:text="${projeto.nome}"></td>
                <td th:text="${projeto.dataInicio}"></td>
                <td th:text="${projeto.departamento.nome}"></td>
                <td th:text="${projeto.funcionario.nome}"></td>
                <td>
                    <a th:href="@{/projetos/{id}/editar(id=${projeto.id})}">Editar</a>
                    <a th:href="@{/projetos/{id}/deletar(id=${projeto.id})}">Deletar</a>
                </td>
            </tr>
        </tbody>
    </table>

    <a href="/">Home</a>
</body>
</html>
