<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulário de Funcionários</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <h1 th:text="${funcionario.id != null} ? 'Editar funcionario' : 'Novo funcionario'">Formulário de Funcionários</h1>
  <form th:action="@{/funcionarios}" th:object="${funcionario}" method="post">
    <input type="hidden" th:if="${funcionario.id !=null}" th:field="*{id}" />
    <div class="form-group">

        <label for="nome">Nome:</label>
        <input type="text" id="nome" th:field="*{nome}" required>
    </div>
    <div class="form-group">

        <label for="cargo">Cargo:</label>
        <input type="text" id="cargo" th:field="*{cargo}" required>
    </div>

    <div class="form-group">

      <label for="salario">Salário:</label>
      <input type="number" id="salario" th:field="*{salario}" required>
  </div>

    <button type="submit" th:text="${funcionario.id !=null} ? 'Atualizar' : 'Salvar'">Salvar</button>
  </form>
  <a href="/funcionarios">Voltar</a>
</body>
</html>
