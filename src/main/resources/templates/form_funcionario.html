<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <!--PAI-->
<head>
    <title>Formulário de Funcionários</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1 th:text="${pai.id != null} ? 'Editar Pai' : 'Novo Pai'">Formulário de Funcionários</h1>
  <form th:action="@{/pais}" th:object="${pai}" method="post">
    <input type="hidden" th:if="${pai.id !=null}" th:field="*{id}" />
    <div class="form-group">

        <label for="nome">Nome:</label>
        <input type="text" id="nome" th:field="*{nome}" required>
    </div>
    <div class="form-group">

        <label for="cargo">Cargo:</label>
        <input type="text" id="cargo" th:field="*{cargo}" required>
    </div>

    <div class="form-group">

      <label for="salario">Salário:</label>
      <input type="number" id="salario" th:field="*{salario}" required>
  </div>

    <button type="submit" th:text="${salario.id !=null} ? 'Atualizar' : 'Salvar'">Salvar</button>
  </form>
  <a href="/salario">Voltar</a>
</body>
</html>
