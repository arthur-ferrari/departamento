<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Projeto</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <h1 th:text="${projeto.id != null} ? 'Editar Projeto' : 'Novo Projeto'"></h1>

    <form th:action="@{/projetos}" th:object="${projeto}" method="post">
        <input type="hidden" th:if="${projeto.id != null}" th:field="*{id}" />

        <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" th:field="*{nome}" required>
        </div>

        <div class="form-group">
            <label for="dataInicio">Data de Início:</label>
            <input type="date" id="dataInicio" th:field="*{dataInicio}" required>
        </div>

        <div class="form-group">
            <label for="departamento">Departamento:</label>
            <select id="departamento" th:field="*{departamento.id}">
                <option th:each="dep : ${departamentos}" th:value="${dep.id}" th:text="${dep.nome}"></option>
            </select>
        </div>

        <div class="form-group">
            <label for="funcionario">Funcionário:</label>
            <select id="funcionario" th:field="*{funcionario.id}">
                <option th:each="func : ${funcionarios}" th:value="${func.id}" th:text="${func.nome}"></option>
            </select>
        </div>

        <button type="submit" th:text="${projeto.id != null} ? 'Atualizar' : 'Salvar'">Salvar</button>
    </form>

    <a href="/projetos">Voltar</a>
</body>
</html>
