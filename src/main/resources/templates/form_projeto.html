<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <title>Formulario do Projeto</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <h1 th:text="${filiacao.id != null} ? 'Editar Filiacao' : 'Nova Filiacao'"></h1>
    <form th:action="@{/filiacao}" th:object="${filiacao}" method="post">
        <input type="hidden" th:if="${filiacao != null}" th:field="*{id}" />

        <div class="form-group">

            <label for="dataInicio">Data de Início :</label>
            <input type="date" id="dataInicio" th:field="*{dataInicio}" required>
        </div>

        <div class="form-group">

            <label for="nome">Nome:</label>
        <input type="text" id="nome" th:field="*{nome}" required>
        </div>

        <div class="form-group">
            <label for="departamento">Departamento:</label>
            <select id="departamento" th:field="*{departamento.id}">
                <option th:each="departamento : ${departamento}" th:value="${departamento.id}" th:text="${departamento.nome}"></option>
            </select>
        </div>

        <div class="form-group">
            <label for="funcionario">Funcionário:</label>
            <select id="funcionario" th:field="*{funcionario.id}">
                <option th:each="funcionario : ${funcionario}" th:value="${funcionario.id}" th:text="${funcionario.nome}"></option>
            </select>
        </div>

        <button type="submit" th:text="${projeto.id != null} ? 'Atualizar' : 'Salvar'">Salvar</button>
    </form>
    <a href="/projeto">Voltar</a>
    
</body>
</html>
